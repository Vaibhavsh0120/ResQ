name: Build Mobile Release (Signed)

# Second, separate workflow from build-release.yml on purpose — see
# .github/workflows/README.md. That workflow stays the fast,
# credential-free path for day-to-day device testing; this one is for
# an actual store-submittable build once real signing credentials exist.
#
# This workflow does not fabricate or assume any credential. Every
# secret it reads must already exist in this repo's
# Settings → Secrets and variables → Actions before running it — each
# job checks for its required secrets first and fails with a clear,
# named list of what's missing rather than attempting a build that
# would only fail later, confusingly, mid-signing.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (example: v1.0.0)"
        required: true
        default: "v1.0.0"

      release_name:
        description: "Release name"
        required: true
        default: "ResQ Mobile Build (Signed)"

permissions:
  contents: write

jobs:
  check-secrets:
    name: Verify signing secrets are configured
    runs-on: ubuntu-latest
    outputs:
      android_ready: ${{ steps.check.outputs.android_ready }}
      ios_ready: ${{ steps.check.outputs.ios_ready }}
    steps:
      - name: Check which secrets are present
        id: check
        run: |
          missing=()

          # Android: a real upload keystore, base64-encoded, plus its
          # passwords and key alias. Generate one with:
          #   keytool -genkeypair -v -keystore upload-keystore.jks \
          #     -alias resq-upload -keyalg RSA -keysize 2048 -validity 10000
          # then: base64 -i upload-keystore.jks | pbcopy   (macOS)
          #       base64 -w0 upload-keystore.jks            (Linux)
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then missing+=("ANDROID_KEYSTORE_BASE64"); fi
          if [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]; then missing+=("ANDROID_KEYSTORE_PASSWORD"); fi
          if [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then missing+=("ANDROID_KEY_ALIAS"); fi
          if [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then missing+=("ANDROID_KEY_PASSWORD"); fi

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "android_ready=true" >> "$GITHUB_OUTPUT"
            echo "Android signing secrets: all present."
          else
            echo "android_ready=false" >> "$GITHUB_OUTPUT"
            echo "Android signing secrets missing: ${missing[*]}"
          fi

          missing=()
          # iOS: a distribution certificate (.p12, base64-encoded) and its
          # password, plus a provisioning profile (.mobileprovision, base64
          # -encoded) — both require an active Apple Developer Program
          # membership to obtain. ASC_KEY_ID/ASC_ISSUER_ID/ASC_KEY_BASE64
          # are an App Store Connect API key, used to notarize/upload
          # without an interactive Apple ID sign-in.
          if [ -z "${{ secrets.IOS_DIST_CERT_BASE64 }}" ]; then missing+=("IOS_DIST_CERT_BASE64"); fi
          if [ -z "${{ secrets.IOS_DIST_CERT_PASSWORD }}" ]; then missing+=("IOS_DIST_CERT_PASSWORD"); fi
          if [ -z "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" ]; then missing+=("IOS_PROVISIONING_PROFILE_BASE64"); fi
          if [ -z "${{ secrets.ASC_KEY_ID }}" ]; then missing+=("ASC_KEY_ID"); fi
          if [ -z "${{ secrets.ASC_ISSUER_ID }}" ]; then missing+=("ASC_ISSUER_ID"); fi
          if [ -z "${{ secrets.ASC_KEY_BASE64 }}" ]; then missing+=("ASC_KEY_BASE64"); fi

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "ios_ready=true" >> "$GITHUB_OUTPUT"
            echo "iOS signing secrets: all present."
          else
            echo "ios_ready=false" >> "$GITHUB_OUTPUT"
            echo "iOS signing secrets missing: ${missing[*]}"
          fi

      - name: Fail with a clear message if nothing is configured yet
        if: steps.check.outputs.android_ready != 'true' && steps.check.outputs.ios_ready != 'true'
        run: |
          echo "::error::No signing secrets are configured for either platform yet."
          echo "This workflow builds real, store-submittable Android/iOS"
          echo "binaries and needs real credentials first — see"
          echo ".github/workflows/README.md and the comments in this file"
          echo "for exactly which secrets to add and how to obtain them."
          echo "Until then, use build-release.yml for unsigned test builds."
          exit 1

  build-android:
    name: Build & sign Android AAB
    needs: check-secrets
    if: needs.check-secrets.outputs.android_ready == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Decode upload keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Build signed AAB
        working-directory: android
        env:
          RESQ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RESQ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RESQ_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=app/upload-keystore.jks \
            -Pandroid.injected.signing.store.password="$RESQ_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$RESQ_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$RESQ_KEY_PASSWORD"

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/upload-keystore.jks

      - name: Prepare AAB
        run: |
          mkdir -p release
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "release/ResQ-${{ inputs.release_tag }}.aab"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v5
        with:
          name: android-aab
          path: release/ResQ-${{ inputs.release_tag }}.aab
          if-no-files-found: error

      # Note: this produces the .aab Play Console expects for a Play
      # App Signing upload. It does not call `gh release` with a draft
      # publish to Google Play itself — that's a separate, deliberate
      # step (Play Console upload, or `fastlane supply` /
      # `google-github-actions/upload-google-play` if that's later
      # wanted) left for whoever owns the actual store listing.

  build-ios:
    name: Build & sign iOS IPA
    needs: check-secrets
    if: needs.check-secrets.outputs.ios_ready == 'true'
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild
        run: npx expo prebuild --platform ios --no-install

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Import distribution certificate & provisioning profile
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

          echo -n "$IOS_DIST_CERT_BASE64" | base64 -d -o "$CERT_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build signed archive
        working-directory: ios
        run: |
          xcodebuild \
            -workspace ResQ.xcworkspace \
            -scheme ResQ \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/ResQ.xcarchive" \
            archive

      - name: Export signed IPA
        working-directory: ios
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ResQ.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          mkdir -p release
          cp "$RUNNER_TEMP/export/ResQ.ipa" \
             "release/ResQ-${{ inputs.release_tag }}.ipa"

      - name: Clean up signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: ios-ipa-signed
          path: release/ResQ-${{ inputs.release_tag }}.ipa
          if-no-files-found: error

      # Note: this produces a real, installable, App-Store-submittable
      # IPA. It does not call `xcrun altool` / App Store Connect upload
      # itself — that's a separate, deliberate step (TestFlight or App
      # Store submission) left for whoever owns the actual App Store
      # Connect listing, using the ASC_* secrets already validated above.

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-android
      - build-ios
    # Only publish if at least one signed build actually ran. Using
    # always() + explicit result checks (rather than the default
    # needs-success behavior) so that signing only one platform (e.g.
    # Android credentials exist, iOS doesn't yet) still produces a
    # release with whatever *did* build, instead of the whole workflow
    # blocking on the platform that isn't ready.
    if: |
      always() &&
      (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release

      - name: Flatten artifacts
        run: |
          mkdir -p flat
          find release -type f \( -name '*.aab' -o -name '*.ipa' \) -exec mv {} flat/ \;
          ls -la flat/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ inputs.release_tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ inputs.release_tag }}" \
              --repo "${{ github.repository }}" \
              flat/* \
              --clobber
            gh release edit "${{ inputs.release_tag }}" \
              --repo "${{ github.repository }}" \
              --title "${{ inputs.release_name }}" \
              --notes "ResQ signed release build(s) - ${{ inputs.release_tag }}. See .github/workflows/README.md for what's signed vs. still pending."
          else
            gh release create "${{ inputs.release_tag }}" \
              --repo "${{ github.repository }}" \
              flat/* \
              --title "${{ inputs.release_name }}" \
              --notes "ResQ signed release build(s) - ${{ inputs.release_tag }}. See .github/workflows/README.md for what's signed vs. still pending."
          fi
