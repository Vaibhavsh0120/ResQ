name: Build Mobile Releases (Unsigned)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (example: v1.0.0)"
        required: true
        default: "v1.0.0"

      release_name:
        description: "Release name"
        required: true
        default: "ResQ Mobile Build"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "release/ResQ-${{ inputs.release_tag }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: release/ResQ-${{ inputs.release_tag }}.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild
        run: npx expo prebuild --platform ios --no-install

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Show Xcode information
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Build unsigned archive
        working-directory: ios
        run: |
          xcodebuild \
            -workspace ResQ.xcworkspace \
            -scheme ResQ \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/ResQ.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Create unsigned IPA
        run: |
          mkdir -p release Payload
          cp -R "$RUNNER_TEMP/ResQ.xcarchive/Products/Applications/ResQ.app" \
                Payload/ResQ.app

          zip -r \
            "release/ResQ-${{ inputs.release_tag }}.ipa" \
            Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: ios-ipa
          path: release/ResQ-${{ inputs.release_tag }}.ipa
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-android
      - build-ios
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release

      - name: Flatten artifacts
        run: |
          mv release/android-apk/*.apk release/
          mv release/ios-ipa/*.ipa release/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ inputs.release_tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ inputs.release_tag }}" \
              --repo "${{ github.repository }}" \
              release/ResQ-${{ inputs.release_tag }}.apk \
              release/ResQ-${{ inputs.release_tag }}.ipa \
              --clobber
            gh release edit "${{ inputs.release_tag }}" \
              --repo "${{ github.repository }}" \
              --title "${{ inputs.release_name }}" \
              --notes "ResQ Android APK + iOS IPA - ${{ inputs.release_tag }}"
          else
            gh release create "${{ inputs.release_tag }}" \
              --repo "${{ github.repository }}" \
              release/ResQ-${{ inputs.release_tag }}.apk \
              release/ResQ-${{ inputs.release_tag }}.ipa \
              --title "${{ inputs.release_name }}" \
              --notes "ResQ Android APK + iOS IPA - ${{ inputs.release_tag }}"
          fi
